<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 프로필 · 마이</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
</head>
<body>
  <nav>
    <div class="logo"><a href="index.html">마이</a></div>
    <div class="nav-links">
      <a href="template.html">템플릿</a>
      <a href="myprofiles.html">내 프로필</a>
      <a href="edit.html">프로필 편집</a>
    </div>
    <div class="nav-auth" id="navAuth"></div>
  </nav>

  <div class="hero hero-sm">
    <div class="hero-left">
      <h1>내 프로필</h1>
      <p>만든 프로필을 한눈에 보고, 바로 수정해요.</p>
    </div>
  </div>

  <div class="tpl-layout">
    <aside class="tpl-side">
      <h3>내가 만든 프로필</h3>
      <div id="mineList"></div>
      <button class="btn-sub" onclick="newProfile()">+ 새 프로필</button>
    </aside>
    <main class="tpl-main">
      <div class="mine-head">
        <div><b id="mineTitle"></b><span id="mineMeta"></span></div>
        <div class="mine-actions">
          <button onclick="editMine()">편집하기</button>
          <button class="btn-sub" onclick="changeTemplateMine()">템플릿 변경</button>
          <button class="btn-sub" onclick="renameMine()">이름 변경</button>
          <button class="btn-sub" onclick="deleteProfile()">삭제</button>
        </div>
      </div>
      <div class="mine-frame" id="mineOutput"></div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>checkLogin(); renderMyProfiles();</script>
</body>
</html>
