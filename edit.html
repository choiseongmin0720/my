<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 편집 · 마이</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
</head>
<body>
  <nav>
    <div class="logo"><a href="index.html">마이</a></div>
    <div class="nav-links">
      <a href="template.html">템플릿</a>
      <a href="myprofiles.html">내 프로필</a>
      <a href="edit.html">프로필 편집</a>
    </div>
    <div class="nav-auth" id="navAuth"></div>
  </nav>

  <div class="hero hero-sm">
    <div class="hero-left">
      <h1>프로필 편집</h1>
      <p>선택한 템플릿: <b id="tplName"></b> · <a href="template.html" style="font-weight:700">템플릿 변경</a></p>
    </div>
  </div>

  <div class="pbar"><select id="profileSelect" onchange="switchProfile(this.value)"></select><input type="text" id="profileTitle" placeholder="프로필 이름"><button class="btn-sub" onclick="newProfile()">새 프로필</button><button class="btn-sub" onclick="deleteProfile()">삭제</button></div>

  <div class="edit-wrap">
    <div class="edit-left">
      <h3>기본 정보</h3>
      <input type="text" id="title" placeholder="제목 (예: 안녕하세요, 디자이너 김마이입니다)">
      <input type="text" id="name" placeholder="이름">
      <input type="text" id="mobile" placeholder="전화번호">
      <input type="text" id="birth" placeholder="생년월일">
      <textarea id="bio" placeholder="자기소개를 입력하세요"></textarea>
      <input type="text" id="github" placeholder="GitHub 주소">
      <input type="text" id="instagram" placeholder="Instagram 아이디">
      <input type="text" id="skills" placeholder="기술·강점 (쉼표로 구분, 예: HTML, CSS, Figma)">
      <label class="file-label">
        프로필 이미지 업로드
        <input type="file" id="photo" accept="image/*">
      </label>
      <img id="photoPrev" class="item-thumb" alt="" style="display:none">
    </div>
    <div class="edit-right">
      <h3>경험·포트폴리오</h3>
      <div id="items"></div>
      <button class="btn-sub btn-add" onclick="addItem()">+ 경험·포트폴리오 추가</button>
      <div class="edit-btns">
        <button class="btn-main" onclick="saveProfile()">저장하기</button>
        <button class="btn-sub" onclick="location.href='profile.html'">미리보기</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    checkLogin();
    renderProfileBar();
    loadProfile();
  </script>
</body>
</html>
